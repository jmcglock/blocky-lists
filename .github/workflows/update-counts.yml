name: update-readme-counts

on:
  push:
    branches: [main]
    paths:
      - "allowlist.txt"
      - "blocklist.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update counts
        run: ./scripts/update-readme-counts.sh
      - name: Commit if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update list counts"
          git push
